<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BMT Upbit Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js" integrity="sha384-8J8e9bGIwf7e9BLO5rwf4zJwNRKcypGnvuGzORD/t4TrFA1gWbl3Hsi/RvyWwBKl" crossorigin="anonymous"></script>
<style>
  :root { --bg:#131722; --panel:#1e222d; --line:#2a2e39; --text:#d1d4dc; --dim:#787b86; --up:#26a69a; --down:#ef5350; --blue:#2962ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"PingFang TC","Helvetica Neue",Arial,sans-serif; font-size:13px; }
  #app { display:flex; flex-direction:column; height:100%; }
  .bar { display:flex; align-items:center; gap:14px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .grp { display:flex; gap:2px; align-items:center; }
  .grp .dim { margin-right:4px; }
  button { background:transparent; color:var(--text); border:0; padding:5px 9px; border-radius:4px; cursor:pointer; font-size:13px; }
  button:hover { background:var(--line); }
  button.on { background:var(--blue); color:#fff; }
  .stat { display:flex; gap:16px; margin-left:auto; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
  .dim { color:var(--dim); }
  .up { color:var(--up); } .down { color:var(--down); }
  .sw { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; }
  #wrap { position:relative; flex:1; min-height:0; }
  #chart { position:absolute; inset:0; }
  #legend { position:absolute; left:10px; top:8px; z-index:5; font-size:12px; line-height:1.6; pointer-events:none;
    background:rgba(19,23,34,.8); padding:4px 8px; border-radius:4px; font-variant-numeric:tabular-nums; }
  .foot { display:flex; gap:18px; padding:5px 12px; background:var(--panel); border-top:1px solid var(--line); color:var(--dim); font-size:12px; flex-wrap:wrap; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#f0b90b; margin-right:5px; }
  .dot.ok { background:var(--up); } .dot.bad { background:var(--down); }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="grp"><span class="dim">Candles</span><span id="sels"></span></div>
    <div class="grp"><span class="dim">Premium base</span><span id="bases"></span></div>
    <div class="grp"><span class="dim">Interval</span><span id="ivs"></span></div>
    <div class="grp"><span class="dim">KRW to USDT</span><span id="fxs"></span></div>
    <div class="stat" id="stat"></div>
  </div>
  <div id="wrap"><div id="chart"></div><div id="legend">Loading data since listing...</div></div>
  <div class="foot">
    <span><span class="dot" id="dUpbit"></span>Upbit</span>
    <span><span class="dot" id="dBinance"></span>Binance</span>
    <span><span class="dot" id="dMexc"></span>MEXC</span>
    <span id="note"></span>
  </div>
</div>
<script>
const UPBIT = "https://api.upbit.com/v1";
const SPOT_REST = ["https://api.binance.com", "https://data-api.binance.vision"];
const FAPI = "https://fapi.binance.com";
// Closed 1m candles since listing, appended every 5 minutes by collect.py on the `data` branch.
// raw.githubusercontent.com caches 5 minutes and sends CORS headers; GitHub Pages caches 10.
const RAW = "https://raw.githubusercontent.com/yyu0310/upbit-premium-chart/data/data/";
const FILES = { upbitKrw: "upbit_krw_bmt", usdtKrw: "upbit_krw_usdt", spot: "binance_spot", perp: "binance_perp", mexcSpot: "mexc_spot", mexcPerp: "mexc_perp" };
const V = {
  upbit:    { name: "Upbit", color: "#5b8cff" },
  spot:     { name: "Binance spot", color: "#f0b90b" },
  perp:     { name: "Binance perp", color: "#ba68c8" },
  mexcSpot: { name: "MEXC spot", color: "#26c6da" },
  mexcPerp: { name: "MEXC perp", color: "#ff8a65" },
};
const BASES = { spot: "Binance spot", mexcSpot: "MEXC spot" };
const IVS = { "1m": 1, "5m": 5, "15m": 15, "1h": 60 };
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };

const START = 1792811100;   // 2026-10-24 03:05 UTC, the first KRW-BMT candle on Upbit
const SHIFT = -new Date().getTimezoneOffset() * 60;   // the chart axis shows local time

// 1m bars per source, keyed by open time in unix seconds: [o, h, l, c]
const M = Object.fromEntries(Object.keys(FILES).map((k) => [k, new Map()]));
let fx = null, fxTime = "";
let sel = V[store("sel")] ? store("sel") : "upbit";
let iv = IVS[store("iv")] ? store("iv") : "5m";
let fxMode = ["fx", "usdt"].includes(store("fx")) ? store("fx") : "fx";
let base = BASES[store("base")] ? store("base") : "spot";

// ---------- Data ----------
const upbitTime = (s) => Date.parse(s + "Z") / 1000;   // candle_date_time_utc has no zone suffix
const lastOf = (key) => { let x = null; for (const t of M[key].keys()) if (x === null || t > x) x = t; return x; };
const firstOf = (key) => { let x = null; for (const t of M[key].keys()) if (x === null || t < x) x = t; return x; };
const lastMinute = () => Math.max(START, ...Object.keys(M).map((k) => lastOf(k) ?? START));

async function getJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}

async function loadCsv(key) {
  try {
    const r = await fetch(RAW + FILES[key] + ".csv");
    if (!r.ok) throw new Error(r.status);
    const lines = (await r.text()).trim().split("\n").slice(1);
    for (const line of lines) { const x = line.split(",").map(Number); M[key].set(x[0], x.slice(1, 5)); }
    console.log(`[csv] ${FILES[key]}: ${lines.length} bars, last ${lastOf(key)}`);
  } catch (e) { console.warn(`[csv] ${FILES[key]} not loaded`, e); }
}

// Upbit allows about one request per 10 seconds from a web page, and its 429 reply has no CORS header,
// so the browser reports it as a network error. Space requests out and retry on any failure.
let upbitNext = 0;
async function upbitGet(url, tries = 6) {
  for (let i = 0; i < tries; i++) {
    const wait = upbitNext - Date.now();
    if (wait > 0) await sleep(wait);
    upbitNext = Date.now() + 10500;
    try { return await getJson(url); } catch (e) { console.warn(`[upbit] try ${i + 1} failed`, url, e); }
  }
  throw new Error(`Upbit unreachable: ${url}`);
}

// Pages back from now until `floor` (unix seconds), drawing after each page
async function upbitHistory(market, key, floor) {
  let to = "";
  for (;;) {
    const rows = await upbitGet(`${UPBIT}/candles/minutes/1?market=${market}&count=200${to}`);
    for (const c of rows) {
      const t = upbitTime(c.candle_date_time_utc);
      if (t >= START) M[key].set(t, [c.opening_price, c.high_price, c.low_price, c.trade_price]);
    }
    schedule();
    if (rows.length < 200 || upbitTime(rows[rows.length - 1].candle_date_time_utc) <= floor) return;
    to = `&to=${rows[rows.length - 1].candle_date_time_utc}Z`;   // newest first; `to` is exclusive
  }
}

// Only the stretch after the CSV needs the rate-limited REST API, normally one page per market
async function upbitAll() {
  await upbitHistory("KRW-BMT", "upbitKrw", lastOf("upbitKrw") ?? START);
  await upbitHistory("KRW-USDT", "usdtKrw", lastOf("usdtKrw") ?? firstOf("upbitKrw") ?? lastMinute());
}

async function binance(key, startMs, limit) {
  const urls = key === "spot"
    ? SPOT_REST.map((h) => `${h}/api/v3/klines?symbol=BMTUSDT&interval=1m`)
    : [`${FAPI}/fapi/v1/klines?symbol=BMTUSDT&interval=1m`];
  let err;
  for (const u of urls) {
    try {
      for (let t = startMs; ;) {
        const rows = await getJson(`${u}&startTime=${t}&limit=${limit}`);
        for (const k of rows) M[key].set(k[0] / 1000, k.slice(1, 5).map(Number));
        if (rows.length < limit) return;
        t = rows[rows.length - 1][0] + 60000;
      }
    } catch (e) { err = e; console.warn("[warn]", u, e); }
  }
  throw err;
}

// Opens a WebSocket that reconnects after 3 seconds and sends `ping` on an interval
function socket(url, dot, { binary, subscribe, ping, every, onData }) {
  const ws = new WebSocket(url);
  if (binary) ws.binaryType = "arraybuffer";
  let timer;
  ws.onopen = () => { ws.send(subscribe); timer = setInterval(() => ws.send(ping), every); $(dot).className = "dot ok"; };
  ws.onmessage = (m) => { try { if (onData(m.data)) schedule(); } catch (e) { console.warn("[ws]", url, e); } };
  ws.onclose = () => { clearInterval(timer); $(dot).className = "dot bad"; setTimeout(() => socket(url, dot, { binary, subscribe, ping, every, onData }), 3000); };
}

// Minimal protobuf reader: varint fields become numbers, length-delimited fields stay as bytes
function pbFields(buf) {
  const out = {}; let i = 0;
  const varint = () => { let r = 0, s = 1, b; do { b = buf[i++]; r += (b & 0x7f) * s; s *= 128; } while (b & 0x80); return r; };
  while (i < buf.length) {
    const key = varint(), f = Math.floor(key / 8), wt = key % 8;
    if (wt === 0) out[f] = varint();
    else if (wt === 2) { const n = varint(); out[f] = buf.subarray(i, i + n); i += n; }
    else if (wt === 1) i += 8; else if (wt === 5) i += 4; else break;
  }
  return out;
}
const pbNum = (b) => Number(new TextDecoder().decode(b));

function sockets() {
  // Upbit sends JSON as binary frames
  socket("wss://api.upbit.com/websocket/v1", "dUpbit", {
    binary: true, every: 60000, ping: "PING",
    subscribe: JSON.stringify([{ ticket: "upbit-premium-chart" }, { type: "candle.1m", codes: ["KRW-BMT", "KRW-USDT"] }]),
    onData: (d) => {
      const c = JSON.parse(new TextDecoder().decode(d));
      if (c.type !== "candle.1m") return false;
      M[c.code === "KRW-BMT" ? "upbitKrw" : "usdtKrw"].set(upbitTime(c.candle_date_time_utc), [c.opening_price, c.high_price, c.low_price, c.trade_price]);
      return true;
    },
  });
  // MEXC futures REST has no CORS header, so live MEXC data comes only from these two sockets
  socket("wss://contract.mexc.com/edge", "dMexc", {
    every: 15000, ping: JSON.stringify({ method: "ping" }),
    subscribe: JSON.stringify({ method: "sub.kline", param: { symbol: "BMT_USDT", interval: "Min1" } }),
    onData: (d) => {
      const j = JSON.parse(d);
      if (j.channel !== "push.kline" || !j.data) return false;
      M.mexcPerp.set(j.data.t, [j.data.o, j.data.h, j.data.l, j.data.c]);
      return true;
    },
  });
  // MEXC spot only pushes protobuf: wrapper field 308 is the kline, whose field 2 is the open time in seconds
  // and fields 3, 4, 5, 6 are open, close, high, low as decimal strings
  socket("wss://wbs-api.mexc.com/ws", "dMexc", {
    binary: true, every: 20000, ping: JSON.stringify({ method: "PING" }),
    subscribe: JSON.stringify({ method: "SUBSCRIPTION", params: ["spot@public.kline.v3.api.pb@BMTUSDT@Min1"] }),
    onData: (d) => {
      if (typeof d === "string") return false;   // subscribe acks and pongs are JSON text
      const w = pbFields(new Uint8Array(d));
      if (!w[308]) return false;
      const k = pbFields(w[308]);
      M.mexcSpot.set(k[2], [pbNum(k[3]), pbNum(k[5]), pbNum(k[6]), pbNum(k[4])]);
      return true;
    },
  });
}

async function pollBinance() {
  for (;;) {
    await sleep(2000);
    const from = Math.floor(Date.now() / 60000) * 60000 - 60000;   // previous minute too, so its final close lands
    const r = await Promise.allSettled([binance("spot", from, 2), binance("perp", from, 2)]);
    $("dBinance").className = "dot " + (r.every((x) => x.status === "fulfilled") ? "ok" : "bad");
    schedule();
  }
}

// ---------- Series ----------
// Align a source to the minute grid. A minute with no candle repeats the previous close as a flat bar
function aligned(key, end) {
  const src = M[key], out = [];
  let prev = null;
  for (let t = START; t <= end; t += 60) {
    const b = src.get(t);
    if (b) prev = b[3];
    out.push(b || (prev === null ? null : [prev, prev, prev, prev]));
  }
  return out;
}

function usd(key, end) {
  if (key !== "upbit") return aligned(key, end);
  const krw = aligned("upbitKrw", end), usdt = aligned("usdtKrw", end);
  return krw.map((b, i) => {
    const r = fxMode === "fx" ? (fx ? [fx, fx, fx, fx] : null) : usdt[i];
    if (!b || !r) return null;
    return [b[0] / r[0], b[1] / r[3], b[2] / r[3], b[3] / r[3]];   // high and low use the USDT close, an approximation
  });
}

function agg(a, n) {
  const out = [];
  for (let i = 0; i < a.length; i += n) {
    const g = a.slice(i, i + n).filter(Boolean);
    if (g.length) out.push({ time: START + i * 60 + SHIFT, o: g[0][0], h: Math.max(...g.map((x) => x[1])), l: Math.min(...g.map((x) => x[2])), c: g[g.length - 1][3] });
  }
  return out;
}

// Premium over the base venue, in percent
function prem(bars, baseBars) {
  const bm = new Map(baseBars.map((b) => [b.time, b]));
  return bars.filter((b) => bm.has(b.time)).map((b) => {
    const s = bm.get(b.time);
    const o = (b.o / s.o - 1) * 100, c = (b.c / s.c - 1) * 100;
    return { time: b.time, open: o, close: c, high: Math.max(o, c, (b.h / s.c - 1) * 100), low: Math.min(o, c, (b.l / s.c - 1) * 100) };
  });
}

// ---------- Chart ----------
const pct = (v) => (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
const cls = (v) => (v >= 0 ? "up" : "down");
const PX = { type: "price", precision: 5, minMove: 0.00001 };
const PF = { type: "custom", formatter: (v) => v.toFixed(2) + "%", minMove: 0.01 };
const CANDLE = { upColor: "#26a69a", downColor: "#ef5350", borderVisible: false, wickUpColor: "#26a69a", wickDownColor: "#ef5350" };
let chart, S = {}, P = {}, idx = {}, pidx = {};

function build() {
  if (chart) chart.remove();
  chart = LightweightCharts.createChart($("chart"), {
    autoSize: true,
    layout: { background: { color: "#131722" }, textColor: "#d1d4dc", panes: { separatorColor: "#2a2e39" } },
    grid: { vertLines: { color: "#1e222d" }, horzLines: { color: "#1e222d" } },
    timeScale: { timeVisible: true, borderColor: "#2a2e39", lockVisibleTimeRangeOnResize: true },
    rightPriceScale: { borderColor: "#2a2e39" },
    crosshair: { mode: 0 },
  });
  S = {}; P = {};
  // Top pane: the selected venue as candles, the others as close lines
  for (const k in V) S[k] = k === sel
    ? chart.addSeries(LightweightCharts.CandlestickSeries, { ...CANDLE, title: V[k].name, priceFormat: PX }, 0)
    : chart.addSeries(LightweightCharts.LineSeries, { color: V[k].color, lineWidth: 1, title: V[k].name, priceFormat: PX }, 0);
  // Bottom pane: premium of every other venue over the base
  for (const k in V) if (k !== base) P[k] = k === sel
    ? chart.addSeries(LightweightCharts.CandlestickSeries, { ...CANDLE, title: V[k].name, priceFormat: PF }, 1)
    : chart.addSeries(LightweightCharts.LineSeries, { color: V[k].color, lineWidth: 1, title: V[k].name, priceFormat: PF }, 1);
  P.upbit.createPriceLine({ price: 0, color: "#787b86", lineWidth: 1, lineStyle: 2, title: BASES[base] });
  try { chart.panes()[1].setHeight(Math.round($("wrap").clientHeight * 0.4)); } catch (e) {}
  chart.subscribeCrosshairMove(legend);
  draw();
  chart.timeScale().fitContent();
}

function draw() {
  if (!chart || !M[base].size) return;
  const end = lastMinute(), bars = {}, pr = {};
  for (const k in V) bars[k] = agg(usd(k, end), IVS[iv]);
  for (const k in P) pr[k] = prem(bars[k], bars[base]);
  for (const k in V) S[k].setData(k === sel
    ? bars[k].map((b) => ({ time: b.time, open: b.o, high: b.h, low: b.l, close: b.c }))
    : bars[k].map((b) => ({ time: b.time, value: b.c })));
  for (const k in P) P[k].setData(k === sel ? pr[k] : pr[k].map((b) => ({ time: b.time, value: b.close })));
  idx = {}; pidx = {};
  for (const k in V) idx[k] = new Map(bars[k].map((b) => [b.time, b]));
  for (const k in P) pidx[k] = new Map(pr[k].map((b) => [b.time, b]));
  $("stat").innerHTML = Object.keys(V).map((k) => {
    const b = bars[k][bars[k].length - 1], p = pr[k] && pr[k][pr[k].length - 1];
    return `<span><span class="sw" style="background:${V[k].color}"></span>${V[k].name} <b>${b ? b.c.toFixed(5) : "-"}</b>` +
      (p ? ` <b class="${cls(p.close)}">${pct(p.close)}</b>` : "") + `</span>`;
  }).join("");
}

let pending = false;
function schedule() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; draw(); }); } }

function legend(p) {
  if (!p.time) { $("legend").textContent = ""; return; }
  $("legend").innerHTML = Object.keys(V).map((k) => {
    const b = idx[k] && idx[k].get(p.time), q = pidx[k] && pidx[k].get(p.time);
    if (!b) return "";
    const ohlc = k === sel ? `O ${b.o.toFixed(5)} H ${b.h.toFixed(5)} L ${b.l.toFixed(5)} C ${b.c.toFixed(5)}` : b.c.toFixed(5);
    return `<span style="color:${V[k].color}">${V[k].name}</span> ${ohlc}` + (q ? ` <span class="${cls(q.close)}">${pct(q.close)}</span>` : "");
  }).join("<br>");
}

// ---------- Controls ----------
function buttons(id, opts, cur, set) {
  $(id).innerHTML = "";
  for (const [k, label] of Object.entries(opts)) {
    const b = document.createElement("button");
    b.textContent = label; b.className = k === cur ? "on" : "";
    b.onclick = () => { set(k); controls(); build(); };
    $(id).appendChild(b);
  }
}
function controls() {
  buttons("sels", Object.fromEntries(Object.entries(V).map(([k, v]) => [k, v.name])), sel, (k) => { sel = k; store("sel", k); });
  buttons("bases", BASES, base, (k) => { base = k; store("base", k); });
  buttons("ivs", Object.fromEntries(Object.keys(IVS).map((k) => [k, k])), iv, (k) => { iv = k; store("iv", k); });
  buttons("fxs", { fx: fx ? `USD/KRW ${fx.toFixed(2)}` : "USD/KRW", usdt: "Upbit USDT/KRW" }, fxMode, (k) => { fxMode = k; store("fx", k); });
}

async function main() {
  controls();
  await Promise.all(Object.keys(FILES).map(loadCsv));
  // Upbit REST is rate limited, so it fills in behind everything else instead of holding up the first draw
  const up = upbitAll().then(() => { $("dUpbit").className = "dot ok"; }, (e) => { console.error(e); $("dUpbit").className = "dot bad"; })
    .then(() => console.log(`Upbit history done: BMT ${M.upbitKrw.size}, USDT ${M.usdtKrw.size} bars`));
  const r = await Promise.allSettled([
    binance("spot", (lastOf("spot") ?? START) * 1000, 1000), binance("perp", (lastOf("perp") ?? START) * 1000, 1500),
    getJson("https://open.er-api.com/v6/latest/USD").then((j) => { fx = j.rates.KRW; fxTime = j.time_last_update_utc; }),
  ]);
  r.forEach((x) => x.status === "rejected" && console.error(x.reason));
  $("dBinance").className = "dot " + (r[0].status === "fulfilled" && r[1].status === "fulfilled" ? "ok" : "bad");
  console.log(`Loaded 1m bars: ${Object.entries(M).map(([k, m]) => `${k} ${m.size}`).join(", ")}, USD/KRW ${fx}`);
  $("legend").textContent = M[base].size ? "" : `${BASES[base]} data failed to load, so premiums cannot be drawn. Try the other base.`;
  $("note").textContent = `Premium = venue price / base price - 1. Upbit KRW-BMT is converted with USD/KRW ${fx ? fx.toFixed(2) : "(unavailable)"} (${fxTime || "open.er-api.com"}) or with Upbit KRW-USDT per minute. History comes from CSV files updated every 5 minutes. The last few minutes before the page opened are fetched live, except MEXC, which repeats its last stored close until its WebSocket sends a new candle. The Upbit dot can turn red for a few seconds right after opening and then go green on its own. Minutes without trades repeat the previous close. Times are local.`;
  controls();
  build();
  sockets();
  pollBinance();
  await up;
}
main();
</script>
</body>
</html>
